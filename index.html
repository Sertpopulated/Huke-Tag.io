<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Huke Tag</title>
  <style>
    body {
      margin: 0;
      padding: 15px;
      background: #0d0d1a;
      font-family: 'Segoe UI', sans-serif;
      color: #e0e0ff;
    }
    .screen { display: none; }
    .screen.active { display: block; }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background: #161625;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 100, 255, 0.2);
    }
    h1, h2 {
      text-align: center;
      color: #4fc3f7;
    }
    input, select, button {
      padding: 10px;
      margin: 8px 0;
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #3a3a5a;
      border-radius: 6px;
      background: #222;
      color: white;
    }
    button {
      background: #1976d2;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #1565c0; }
    canvas {
      border: 2px solid #3a3a5a;
      background: #000;
      display: block;
      margin: 0 auto;
      position: relative;
    }
    #minimap {
      position: absolute;
      top: 20px;
      right: 20px;
      border: 2px solid #3a3a5a;
      background: rgba(0,0,0,0.7);
    }
    #gameUI {
      text-align: center;
      margin-top: 10px;
    }
    label { display: block; margin-top: 10px; font-size: 0.9em; }
    input[type="color"] {
      width: 80px;
      height: 40px;
      padding: 0;
      background: none;
      border: 1px solid #555;
    }
    #statsScreen, #authScreen {
      text-align: center;
    }
    .stat-row {
      padding: 8px;
      border-bottom: 1px solid #333;
    }
    #userEmail {
      text-align: center;
      font-style: italic;
      margin-top: 10px;
      color: #a0d0ff;
    }
  </style>
</head>
<body>

  <!-- Auth Screen -->
  <div id="authScreen" class="screen active">
    <div class="container">
      <h1>🔐 Huke Tag</h1>
      <input type="email" id="email" placeholder="Email" />
      <input type="password" id="password" placeholder="Password" />
      <button id="loginBtn">Log In</button>
      <button id="signupBtn">Sign Up</button>
      <p style="font-size:0.9em; color:#888;">Your stats and avatar will be saved!</p>
    </div>
  </div>

  <!-- Main Menu -->
  <div id="mainMenu" class="screen">
    <div class="container">
      <h1>🔥 Huke Tag</h1>
      <div id="userEmail"></div>
      <button id="createBtn">Create Room</button>
      <button id="joinBtn">Join Room</button>
      <button id="logoutBtn">Log Out</button>
    </div>
  </div>

  <!-- Create Room -->
  <div id="createRoom" class="screen">
    <div class="container">
      <h2>Create Room</h2>
      <input type="text" id="roomName" placeholder="Room code (e.g. party123)" required />
      <select id="maxPlayers">
        <option value="5">5 players</option>
        <option value="10">10 players</option>
        <option value="20" selected>20 players</option>
        <option value="30">30 players</option>
        <option value="40">40 players</option>
      </select>
      <label>Game Mode:</label>
      <select id="gameMode">
        <option value="classic">Classic (10s timer)</option>
        <option value="chaos">Chaos (5s auto-pass)</option>
        <option value="survival">Survival (tag to pass)</option>
      </select>
      <label>Avatar Color:</label>
      <input type="color" id="avatarColor" value="#ff5252" />
      <label>
        <input type="checkbox" id="practiceMode" /> Practice Mode (you + bots)
      </label>
      <div id="mapSelector" style="display:none;">
        <label>Map:</label>
        <select id="mapSelect"></select>
      </div>
      <button id="createRoomBtn">Create</button>
      <button id="back1">← Back</button>
    </div>
  </div>

  <!-- Join Room -->
  <div id="joinRoom" class="screen">
    <div class="container">
      <h2>Join Room</h2>
      <input type="text" id="joinCode" placeholder="Enter room code" required />
      <button id="joinCodeBtn">Join</button>
      <button id="back2">← Back</button>
    </div>
  </div>

  <!-- Game View -->
  <div id="gameView" class="screen">
    <canvas id="gameCanvas" width="1000" height="600"></canvas>
    <canvas id="minimap" width="150" height="100"></canvas>
    <div id="gameUI">
      <div id="gameStatus">...</div>
      <div>
        Timer: <span id="timer">10</span>s | 
        Players: <span id="playerCount">0</span>
      </div>
      <button id="leaveGameBtn">Leave Game</button>
    </div>
  </div>

  <!-- Stats Screen -->
  <div id="statsScreen" class="screen">
    <div class="container">
      <h2>📊 Game Stats</h2>
      <div id="statsList"></div>
      <button id="backToMenu">Back to Menu</button>
    </div>
  </div>

      Object.values(screens).forEach(s => s.classList.remove('active'));

      const password = document.getElementById('password').value;
      createUserWithEmailAndPassword(auth, email, password)
        .catch(e => alert("Sign up failed: " + e.message));
    };

    document.getElementById('logoutBtn').onclick = () => {
      signOut(auth).then(() => showScreen('auth'));
    };

      thornspire: { name: "Thornspire", walls: [{x:0,y:0,w:WORLD_WIDTH,h:20},{x:0,y:WORLD_HEIGHT-20,w:WORLD_WIDTH,h:20},{x:0,y:0,w:20,h:WORLD_HEIGHT},{x:WORLD_WIDTH-20,y:0,w:20,h:WORLD_HEIGHT},{x:590,y:150,w:20,h:500},{x:150,y:150,w:180,h:120},{x:870,y:150,w:160,h:120},{x:150,y:530,w:180,h:120},{x:870,y:530,w:160,h:120},{x:390,y:350,w:90,h:100}] },
      celestara: { name: "Celestara", walls: [{x:0,y:0,w:WORLD_WIDTH,h:20},{x:0,y:WORLD_HEIGHT-20,w:WORLD_WIDTH,h:20},{x:0,y:0,w:20,h:WORLD_HEIGHT},{x:WORLD_WIDTH-20,y:0,w:20,h:WORLD_HEIGHT},{x:590,y:100,w:20,h:600},{x:100,y:100,w:220,h:160},{x:880,y:100,w:200,h:160},{x:100,y:540,w:220,h:160},{x:880,y:540,w:200,h:160},{x:400,y:350,w:150,h:100}] },
      dusthaven: { name: "Dusthaven", walls: [{x:0,y:0,w:WORLD_WIDTH,h:20},{x:0,y:WORLD_HEIGHT-20,w:WORLD_WIDTH,h:20},{x:0,y:0,w:20,h:WORLD_HEIGHT},{x:WORLD_WIDTH-20,y:0,w:20,h:WORLD_HEIGHT},{x:590,y:130,w:20,h:540},{x:130,y:130,w:190,h:130},{x:880,y:130,w:170,h:130},{x:130,y:540,w:190,h:130},{x:880,y:540,w:170,h:130},{x:350,y:350,w:130,h:100}] },
      echo_vault: { name: "Echo Vault", walls: [{x:0,y:0,w:WORLD_WIDTH,h:20},{x:0,y:WORLD_HEIGHT-20,w:WORLD_WIDTH,h:20},{x:0,y:0,w:20,h:WORLD_HEIGHT},{x:WORLD_WIDTH-20,y:0,w:20,h:WORLD_HEIGHT},{x:590,y:110,w:20,h:580},{x:110,y:110,w:210,h:150},{x:890,y:110,w:190,h:150},{x:110,y:540,w:210,h:150},{x:890,y:540,w:190,h:150},{x:360,y:350,w:120,h:100}] },
      flux_den: { name: "Flux Den", walls: [{x:0,y:0,w:WORLD_WIDTH,h:20},{x:0,y:WORLD_HEIGHT-20,w:WORLD_WIDTH,h:20},{x:0,y:0,w:20,h:WORLD_HEIGHT},{x:WORLD_WIDTH-20,y:0,w:20,h:WORLD_HEIGHT},{x:590,y:140,w:20,h:520},{x:140,y:140,w:180,h:120},{x:880,y:140,w:160,h:120},{x:140,y:540,w:180,h:120},{x:880,y:540,w:160,h:120},{x:370,y:350,w:110,h:100}] },
      wyrmspire: { name: "Wyrmspire", walls: [{x:0,y:0,w:WORLD_WIDTH,h:20},{x:0,y:WORLD_HEIGHT-20,w:WORLD_WIDTH,h:20},{x:0,y:0,w:20,h:WORLD_HEIGHT},{x:WORLD_WIDTH-20,y:0,w:20,h:WORLD_HEIGHT},{x:590,y:100,w:20,h:600},{x:100,y:100,w:220,h:160},{x:880,y:100,w:200,h:160},{x:100,y:540,w:220,h:160},{x:880,y:540,w:200,h:160},{x:400,y:350,w:150,h:100}] }
    };

    const NAMES = ["Liam","Noah","Oliver","James","Elijah","William","Henry","Lucas","Benjamin","Theo","Emma","Olivia","Ava","Charlotte","Sophia","Amelia","Isabella","Mia","Evelyn","Harper","Alex","Taylor","Jordan","Casey","Riley","Quinn","Morgan","Dakota","Skyler","Avery","Leo","Max","Finn","Arlo","Eli","Jude","Kai","Luca","Zane","Nico"];

    // ===== GAME STATE =====
    let localPlayerId = null;
    let localPlayerName = null;
    let localColor = '#ff5252';
    let roomId = null;
    let isHost = false;
    let isPracticeMode = false;
    let selectedMap = 'solaris_core';
    let gameMode = 'classic';
    let ctx = document.getElementById('gameCanvas').getContext('2d');
    let minimapCtx = document.getElementById('minimap').getContext('2d');
    let keys = {};
    let camera = { x: 0, y: 0 };
    let gameActive = false;
    let timer = 10;
    let timerInterval = null;
    let players = {};
    let hukeHolderId = null;
    let gameRef = null;
    let bots = [];
    let startTime = Date.now();
    let survivalTime = 0;

    // ===== UI NAVIGATION =====
    document.getElementById('createBtn').onclick = () => {
      showScreen('create');
      document.getElementById('mapSelector').style.display = 'block';
      populateMapSelect();
    };
    document.getElementById('joinBtn').onclick = () => showScreen('join');
    document.getElementById('back1').onclick = () => showScreen('main');
    document.getElementById('back2').onclick = () => showScreen('main');
    document.getElementById('backToMenu').onclick = () => showScreen('main');

    function populateMapSelect() {
      const select = document.getElementById('mapSelect');
      select.innerHTML = '';
      Object.keys(MAPS).forEach(key => {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = MAPS[key].name;
        select.appendChild(opt);
      });
    }

    // ===== PLAYER CLASS =====
    class Player {
      constructor(id, name, x, y, color = '#4fc3f7', isLocal = false) {
        this.id = id;
        this.name = name;
        this.x = x;
        this.y = y;
        this.color = color;
        this.isLocal = isLocal;
        this.active = true;
        this.hasHuke = false;
        this.radius = 14;
        this.speed = 2.8;
        this.targetX = x;
        this.targetY = y;
        this.lastChange = 0;
        this.isBot = false;
      }

      update() {
        if (!this.active) return;
        if (this.isLocal) {
          let vx = 0, vy = 0;
          if (keys['w'] || keys['arrowup']) vy = -1;
          if (keys['s'] || keys['arrowdown']) vy = 1;
          if (keys['a'] || keys['arrowleft']) vx = -1;
          if (keys['d'] || keys['arrowright']) vx = 1;
          if (vx !== 0 && vy !== 0) { vx *= 0.707; vy *= 0.707; }
          const speed = this.hasHuke ? 4.2 : 2.8;
          this.x += vx * speed;
          this.y += vy * speed;
          this.x = Math.max(this.radius, Math.min(WORLD_WIDTH - this.radius, this.x));
          this.y = Math.max(this.radius, Math.min(WORLD_HEIGHT - this.radius, this.y));
        } else if (this.isBot) {
          const now = Date.now();
          if (now - this.lastChange > 2000 + Math.random() * 3000) {
            this.targetX = Math.random() * (WORLD_WIDTH - 100) + 50;
            this.targetY = Math.random() * (WORLD_HEIGHT - 100) + 50;
            this.lastChange = now;
          }
          const dx = this.targetX - this.x;
          const dy = this.targetY - this.y;
          const dist = Math.hypot(dx, dy);
          if (dist > 2) {
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;
          }
        }
      }

      draw(camX, camY) {
        if (!this.active) return;
        const sx = this.x - camX;
        const sy = this.y - camY;
        if (sx < -50 || sx > SCREEN_WIDTH + 50 || sy < -50 || sy > SCREEN_HEIGHT + 50) return;
        ctx.beginPath();
        ctx.arc(sx, sy, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        if (this.isLocal && this.hasHuke) {
          ctx.beginPath();
          ctx.arc(sx, sy, this.radius + 10, 0, Math.PI * 2);
          ctx.strokeStyle = '#ffff00';
          ctx.setLineDash([5,5]);
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.setLineDash([]);
        }
        ctx.fillStyle = 'white';
        ctx.font = '11px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(this.isLocal ? "You" : this.name, sx, sy + 22);
      }

      drawOnMinimap() {
        if (!this.active) return;
        const mx = (this.x / WORLD_WIDTH) * 150;
        const my = (this.y / WORLD_HEIGHT) * 100;
        minimapCtx.beginPath();
        minimapCtx.arc(mx, my, 3, 0, Math.PI * 2);
        minimapCtx.fillStyle = this.isLocal ? '#ff0000' : this.color;
        minimapCtx.fill();
      }
    }

    // ===== GAME LOGIC =====
    document.getElementById('createRoomBtn').onclick = () => {
      const user = auth.currentUser;
      if (!user) return alert("Please log in first!");

      const roomCode = document.getElementById('roomName').value.trim();
      if (!roomCode) return alert("Enter a room code");
      const maxPlayers = parseInt(document.getElementById('maxPlayers').value);
      isPracticeMode = document.getElementById('practiceMode').checked;
      selectedMap = document.getElementById('mapSelect').value;
      gameMode = document.getElementById('gameMode').value;
      localColor = document.getElementById('avatarColor').value;
      roomId = roomCode;
      localPlayerId = user.uid;
      localPlayerName = user.email.split('@')[0] || "Player";
      isHost = true;

      showScreen('game');
      if (isPracticeMode) {
        startPracticeMode(maxPlayers - 1);
      } else {
        startMultiplayerAsHost(maxPlayers);
      }
    };

    document.getElementById('joinCodeBtn').onclick = () => {
      const user = auth.currentUser;
      if (!user) return alert("Please log in first!");

      const code = document.getElementById('joinCode').value.trim();
      if (!code) return alert("Enter room code");

      roomId = code;
      localPlayerId = user.uid;
      localPlayerName = user.email.split('@')[0] || "Player";
      localColor = '#4fc3f7';
      isHost = false;
      isPracticeMode = false;

      showScreen('game');
      joinMultiplayerRoom();
    };

    document.getElementById('leaveGameBtn').onclick = () => {
      endGame(null, true);
    };

    function startPracticeMode(botCount) {
      const human = new Player(localPlayerId, "You", WORLD_WIDTH/2, WORLD_HEIGHT/2, localColor, true);
      players = { [localPlayerId]: human };
      bots = [human];
      for (let i = 0; i < botCount; i++) {
        let x, y;
        do {
          x = Math.random() * (WORLD_WIDTH - 100) + 50;
          y = Math.random() * (WORLD_HEIGHT - 100) + 50;
        } while (Math.hypot(x - human.x, y - human.y) < 100);
        const bot = new Player('bot'+i, NAMES[i % NAMES.length], x, y, '#4fc3f7', false);
        bot.isBot = true;
        players['bot'+i] = bot;
        bots.push(bot);
      }

      const hukeBot = bots[Math.floor(Math.random() * bots.length)];
      hukeBot.hasHuke = true;
      hukeHolderId = hukeBot.id;

      gameActive = true;
      startTime = Date.now();
      startTimer();

      window.addEventListener('keydown', handleKeyDown);
      window.addEventListener('keyup', handleKeyUp);

      gameLoop();
    }

    function startMultiplayerAsHost(maxPlayers) {
      gameRef = ref(database, `rooms/${roomId}`);
      onValue(gameRef, (snapshot) => {
        if (snapshot.exists()) return alert("Room already exists!");
      }, { onlyOnce: true });

      set(gameRef, {
        host: localPlayerId,
        maxPlayers,
        map: selectedMap,
        gameMode,
        gameActive: true,
        hukeHolderId: null,
        timer: gameMode === 'chaos' ? 5 : 10,
        createdAt: Date.now()
      }).then(() => {
        set(ref(database, `rooms/${roomId}/players/${localPlayerId}`), {
          name: localPlayerName,
          x: WORLD_WIDTH/2,
          y: WORLD_HEIGHT/2,
          color: localColor,
          active: true,
          isHost: true,
          stats: { wins: 0, survivalTime: 0 }
        });
        setupMultiplayerListeners();
      });
    }

    function joinMultiplayerRoom() {
      gameRef = ref(database, `rooms/${roomId}`);
      onValue(gameRef, (snapshot) => {
        if (!snapshot.exists()) return alert("Room not found");
        const room = snapshot.val();
        if (Object.keys(room.players || {}).length >= room.maxPlayers) {
          return alert("Room is full");
        }
        set(ref(database, `rooms/${roomId}/players/${localPlayerId}`), {
          name: localPlayerName,
          x: Math.random() * (WORLD_WIDTH - 100) + 50,
          y: Math.random() * (WORLD_HEIGHT - 100) + 50,
          color: localColor,
          active: true,
          stats: { wins: 0, survivalTime: 0 }
        });
        setupMultiplayerListeners();
      }, { onlyOnce: true });
    }

    function setupMultiplayerListeners() {
      onValue(ref(database, `rooms/${roomId}`), (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        players = {};
        if (data.players) {
          for (const id in data.players) {
            const p = data.players[id];
            players[id] = new Player(id, p.name, p.x, p.y, p.color, id === localPlayerId);
            players[id].active = p.active;
            players[id].hasHuke = (id === data.hukeHolderId);
          }
        }

        hukeHolderId = data.hukeHolderId;
        timer = data.timer || (data.gameMode === 'chaos' ? 5 : 10);
        gameActive = data.gameActive !== false;
        selectedMap = data.map || 'solaris_core';
        gameMode = data.gameMode || 'classic';

        updateUI();
      });

      startGameLoop();
    }

    function handleKeyDown(e) {
      keys[e.key.toLowerCase()] = true;
      if (e.key === ' ' && gameActive && gameMode !== 'survival') {
        const local = players[localPlayerId];
        if (local && local.hasHuke) {
          let nearest = null;
          let minDist = 70;
          for (const id in players) {
            if (id === localPlayerId || !players[id].active) continue;
            const dist = Math.hypot(players[id].x - local.x, players[id].y - local.y);
            if (dist < minDist) {
              minDist = dist;
              nearest = id;
            }
          }
          if (nearest) {
            if (isPracticeMode) {
              local.hasHuke = false;
              players[nearest].hasHuke = true;
              hukeHolderId = nearest;
              resetTimer();
            } else {
              set(ref(database, `rooms/${roomId}/passRequest`), {
                from: localPlayerId,
                to: nearest,
                timestamp: Date.now()
              });
            }
          }
        }
      }
    }

    function handleKeyUp(e) {
      keys[e.key.toLowerCase()] = false;
    }

    function startTimer() {
      clearInterval(timerInterval);
      timer = gameMode === 'chaos' ? 5 : 10;
      updateUI();
      timerInterval = setInterval(() => {
        timer--;
        updateUI();
        if (timer <= 0) {
          eliminateHukeHolder();
        }
      }, 1000);
    }

    function resetTimer() {
      if (isPracticeMode) {
        clearInterval(timerInterval);
        startTimer();
      } else {
        set(ref(database, `rooms/${roomId}/timer`), gameMode === 'chaos' ? 5 : 10);
      }
    }

    function updateUI() {
      document.getElementById('timer').textContent = timer;
      document.getElementById('playerCount').textContent = Object.keys(players).filter(id => players[id].active).length;

      const local = players[localPlayerId];
      if (local && local.hasHuke) {
        document.getElementById('gameStatus').textContent = "⚠️ YOU ARE 'IT'! Press SPACE near someone to pass!";
      } else {
        document.getElementById('gameStatus').textContent = "Someone is 'It'... stay safe!";
      }
    }

    function eliminateHukeHolder() {
      if (!hukeHolderId) return;
      const holder = players[hukeHolderId];
      if (!holder || !holder.active) return;

      if (isPracticeMode) {
        holder.active = false;
        const alive = bots.filter(b => b.active);
        if (alive.length <= 1) {
          survivalTime = Math.floor((Date.now() - startTime) / 1000);
          const winner = alive[0];
          const isWinner = winner.isLocal;
          endGame(isWinner ? 'win' : 'loss', false, isWinner ? 1 : 0, survivalTime);
          return;
        }
        const newHolder = alive[Math.floor(Math.random() * alive.length)];
        newHolder.hasHuke = true;
        hukeHolderId = newHolder.id;
        resetTimer();
      } else {
        update(ref(database, `rooms/${roomId}/players/${hukeHolderId}`), { active: false });
        const aliveIds = Object.keys(players).filter(id => players[id].active && id !== hukeHolderId);
        if (aliveIds.length <= 1) {
          const winnerId = aliveIds[0] || localPlayerId;
          const isWinner = winnerId === localPlayerId;
          survivalTime = Math.floor((Date.now() - startTime) / 1000);
          set(ref(database, `rooms/${roomId}/gameActive`), false);
          transaction(ref(database, `rooms/${roomId}/players/${winnerId}/stats/wins`), wins => (wins || 0) + 1);
          transaction(ref(database, `rooms/${roomId}/players/${winnerId}/stats/survivalTime`), time => (time || 0) + survivalTime);
          endGame(isWinner ? 'win' : 'loss', false, isWinner ? 1 : 0, survivalTime);
          return;
        }
        const newHolderId = aliveIds[Math.floor(Math.random() * aliveIds.length)];
        set(ref(database, `rooms/${roomId}/hukeHolderId`), newHolderId);
        set(ref(database, `rooms/${roomId}/timer`), gameMode === 'chaos' ? 5 : 10);
      }
    }

    function gameLoop() {
      if (!gameActive) return;

      if (isPracticeMode) {
        bots.forEach(b => b.update());
        const hukeBot = players[hukeHolderId];
        if (hukeBot && hukeBot.isBot && gameMode !== 'survival') {
          for (const id in players) {
            if (id === hukeHolderId || !players[id].active) continue;
            const dist = Math.hypot(players[id].x - hukeBot.x, players[id].y - hukeBot.y);
            if (dist < 70 && Math.random() < 0.03) {
              hukeBot.hasHuke = false;
              players[id].hasHuke = true;
              hukeHolderId = id;
              resetTimer();
              break;
            }
          }
        }
      }

      const local = players[localPlayerId];
      if (!local) return;

      if (!isPracticeMode) {
        update(ref(database, `rooms/${roomId}/players/${localPlayerId}`), {
          x: local.x,
          y: local.y
        });
      }

      camera.x = local.x - SCREEN_WIDTH / 2;
      camera.y = local.y - SCREEN_HEIGHT / 2;
      camera.x = Math.max(0, Math.min(camera.x, WORLD_WIDTH - SCREEN_WIDTH));
      camera.y = Math.max(0, Math.min(camera.y, WORLD_HEIGHT - SCREEN_HEIGHT));

      ctx.clearRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
      const walls = MAPS[selectedMap]?.walls || [];
      ctx.fillStyle = '#3a3a5a';
      walls.forEach(w => {
        ctx.fillRect(w.x - camera.x, w.y - camera.y, w.w, w.h);
      });
      Object.values(players).forEach(p => p.draw(camera.x, camera.y));

      minimapCtx.clearRect(0, 0, 150, 100);
      minimapCtx.fillStyle = '#111';
      minimapCtx.fillRect(0, 0, 150, 100);
      Object.values(players).forEach(p => p.drawOnMinimap());

      requestAnimationFrame(gameLoop);
    }

    function startGameLoop() {
      if (isPracticeMode) return;
      window.addEventListener('keydown', handleKeyDown);
      window.addEventListener('keyup', handleKeyUp);
      startTime = Date.now();
      gameLoop();
    }

    function endGame(reason, leftEarly = false, wins = 0, survival = 0) {
      gameActive = false;
      clearInterval(timerInterval);

      if (!leftEarly) {
        showStatsScreen(wins, survival);
      } else {
        showScreen('main');
      }
    }

    function showStatsScreen(wins, survival) {
      const statsList = document.getElementById('statsList');
      statsList.innerHTML = `
        <div class="stat-row"><strong>Your Stats</strong></div>
        <div class="stat-row">Result: ${wins > 0 ? '🏆 WIN' : '💀 Eliminated'}</div>
        <div class="stat-row">Survival Time: ${survival}s</div>
        <div class="stat-row">Wins this session: ${wins}</div>
        <br>
        <div class="stat-row"><strong>Leaderboard (Top 5)</strong></div>
      `;

      if (!isPracticeMode) {
        onValue(ref(database, `rooms/${roomId}/players`), (snapshot) => {
          const playersData = snapshot.val() || {};
          const leaderboard = Object.values(playersData)
            .map(p => ({ name: p.name, wins: p.stats?.wins || 0, time: p.stats?.survivalTime || 0 }))
            .sort((a, b) => b.wins - a.wins || b.time - a.time)
            .slice(0, 5);

          leaderboard.forEach((p, i) => {
            const div = document.createElement('div');
            div.className = 'stat-row';
            div.textContent = `#${i+1} ${p.name} - ${p.wins} wins, ${p.time}s`;
            statsList.appendChild(div);
          });
        }, { onlyOnce: true });
      } else {
        const div = document.createElement('div');
        div.className = 'stat-row';
        div.textContent = "Practice Mode — no leaderboard";
        statsList.appendChild(div);
      }

      showScreen('stats');
    }
  </script>
